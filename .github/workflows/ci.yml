name: .NET Platformer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - name: Audit vulnerable NuGet packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee "$RUNNER_TEMP/nuget-vulnerabilities.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/nuget-vulnerabilities.txt"; then
            echo "::error::NuGet vulnerability report contains vulnerable packages."
            exit 1
          fi
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test tests/PlatformerGame.Tests/PlatformerGame.Tests.csproj --configuration Release
