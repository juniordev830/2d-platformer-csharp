name: .NET Platformer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - name: Audit vulnerable NuGet packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee "$RUNNER_TEMP/nuget-vulnerabilities.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/nuget-vulnerabilities.txt"; then
            echo "::error::NuGet vulnerability report contains vulnerable packages."
            exit 1
          fi
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test tests/PlatformerGame.Tests/PlatformerGame.Tests.csproj --configuration Release
