name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build PlatformerGame.csproj
      - name: Run tests when test project exists
        run: |
          if [ -f tests/PlatformerGame.Tests/PlatformerGame.Tests.csproj ]; then
            dotnet test tests/PlatformerGame.Tests/PlatformerGame.Tests.csproj
          else
            echo "Projeto de testes não encontrado; build concluído."
          fi
